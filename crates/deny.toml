# cargo-deny configuration for the SecureYeoman Rust workspace.
#
# Run with: cargo deny --manifest-path crates/Cargo.toml check
#
# Sections:
#   advisories — security vulnerabilities
#   licenses   — license compatibility for AGPL-3.0-only distribution
#   bans       — duplicate / multiple-version detection (warn-only for now)
#   sources    — restrict crate sources

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2023-0071 — rsa 0.9.10 Marvin Attack: timing sidechannel in private-key ops.
# Reaches us only via sqlx-mysql, which sqlx pulls unconditionally. We do NOT use
# MySQL at runtime (PostgreSQL only). No upstream fix is available; revisit when
# rsa 0.10 ships and sqlx-mysql adopts it.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
version = 2
# License-expression confidence threshold (default 0.8 is fine).
confidence-threshold = 0.93
# Permissive licenses we accept in dependencies, plus the GPL/AGPL family
# (compatible with this project's AGPL-3.0-only distribution).
#
# Compatibility rationale: AGPL-3.0-only is a strict superset of GPL-3.0-only;
# combined-work distribution under AGPL-3.0 satisfies both. AGNOS ecosystem
# crates (agnosai, ai-hwaccel, bhava, bodh, bote, dhvani, hisab, hoosh, ifran,
# majra, mastishk, shabda, shabdakosh, sharira, svara, szal, abaco, etc.) are
# all published GPL-3.0-only by the same maintainer.
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
# ring uses an OpenSSL-style license that cargo-deny doesn't auto-recognize.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Promote to "deny" once duplicates are tracked down. Today's tree has many.
multiple-versions = "warn"
wildcards = "warn"
# Tooling crates that intentionally appear in multiple versions across the tree.
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
