[package]
name = "sy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SecureYeoman core server — axum-based REST/WS API"

[lib]
name = "sy_core"
path = "src/lib.rs"

[[bin]]
name = "sy-core"
path = "src/main.rs"

[[bin]]
name = "sy-edge"
path = "src/bin/sy-edge/main.rs"

[dependencies]
# Regex engine for DLP/PII scanning (privacy module)
regex = "1"

# Cryptographic primitives (formerly sy-crypto crate)
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
md-5 = "0.10"
rand = "0.8"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
# Password hashing (Argon2id) for the admin login.
argon2 = "0.5"
# Server-side WebAuthn / passkey ceremonies. In-flight ceremony state is kept in
# memory (Passkey{Registration,Authentication} are Clone), so the state-
# serialisation feature is intentionally NOT enabled.
webauthn-rs = "0.5.5"
# OIDC (Authorization Code + PKCE). default-features=false avoids pulling a second
# reqwest (0.12) — we implement openidconnect's AsyncHttpClient over our reqwest 0.13.
openidconnect = { version = "4", default-features = false }
http = "1"

# Hardware accelerator detection (formerly sy-hwprobe crate)
ai-hwaccel = { version = "1.0", default-features = true }

# sy-edge runtime deps (edge binary target)
clap = { version = "4", features = ["derive"] }
gethostname = "1"
sysinfo = "0.35"

# Ecosystem crates (previously accessed via NAPI bridge)
bhava = { version = "2.0.0", features = ["presets", "psychology", "sociology", "physiology", "microbiology", "neuroscience", "instinct"] }
szal = { version = "1.0", features = ["majra"] }
bote = { version = "0.50", features = ["bridge"] }
# TODO(cyrius-port): re-enable when these are wired to their Cyrius versions.
# Currently unused (no `use` in src) — kept here as planned-work markers.
# `agnosai` also pulled the vulnerable wasmtime-wasi (RUSTSEC-2026-0149) and a
# yanked `aes`; commenting it out clears both for the 0.5.1 hardening release.
# dhvani = { version = "1.0.0", features = ["voice", "g2p", "synthesis", "analysis"] }
# agnosai = { version = "1.0.0", features = ["definitions", "sandbox"] }
# majra = { version = "1.0.3", features = ["pubsub", "ratelimit", "heartbeat", "barrier", "queue"] }

axum = { version = "0.8", features = ["json", "ws"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
# TODO(cyrius-port): re-enable when wired (routes/ifran_proxy.rs currently proxies
# an external Ifran HTTP server via reqwest, not this crate). Unused today.
# ifran = { version = "1.2", default-features = false }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
uuid = { version = "1", features = ["v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
base64 = "0.22"
thiserror = "2"
dashmap = "6"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
bytes = "1"
tempfile = "3"
