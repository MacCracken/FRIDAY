# cargo-audit configuration.
# Run with: cargo audit --file crates/Cargo.lock
# (cargo-audit auto-discovers crates/audit.toml when invoked from the workspace.)

[advisories]
# RUSTSEC-2023-0071 — rsa 0.9.10 Marvin Attack (timing sidechannel). Present in
# Cargo.lock ONLY as an optional dependency of sqlx-mysql, which we never build
# (sqlx is postgres-only here), so rsa is not compiled or reachable. cargo-audit
# scans the lockfile literally and flags it regardless; cargo-deny (feature/graph
# aware) does not report it. No upstream fix exists. Re-evaluate if MySQL is ever
# enabled. (The wasmtime-wasi advisory + yanked aes that the unused `agnosai`
# crate pulled are now gone — agnosai is commented out in Cargo.toml.)
ignore = ["RUSTSEC-2023-0071"]
informational_warnings = ["unmaintained", "notice"]
severity_threshold = "low"
