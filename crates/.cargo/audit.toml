# cargo-audit configuration.
# Run with: cargo audit --file crates/Cargo.lock
# (cargo-audit auto-discovers crates/audit.toml when invoked from the workspace.)

[advisories]
# RUSTSEC-2023-0071 — rsa 0.9.10 Marvin Attack: timing sidechannel.
# Reaches us only via sqlx-mysql, pulled unconditionally by sqlx; we use
# PostgreSQL only. No upstream fix available. Revisit when rsa 0.10 ships
# and sqlx-mysql adopts it.
ignore = ["RUSTSEC-2023-0071"]
informational_warnings = ["unmaintained", "notice"]
severity_threshold = "low"
